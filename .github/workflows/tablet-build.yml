name: Build KOCMOMATICS Tablet

on:
  push:
    branches: [main, master]
    paths:
      - 'tablet-app/**'
      - '.github/workflows/tablet-build.yml'
      - 'gradlew'
      - 'gradle/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android APK
        run: |
          chmod +x gradlew
          ./gradlew -p tablet-app assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KOCMOMATICS-Tablet
          path: tablet-app/app/build/outputs/apk/debug/app-debug.apk
